<!DOCTYPE html>
<!-- ↑ 这行声明"这是 HTML5 文档"，每个网页开头都要有 -->

<html lang="zh-CN">
<!-- html 是整个网页的"根"，lang 表示页面语言是中文 -->

<head>
  <!-- head 里放的是"给浏览器看的设置"，内容不会显示在页面上 -->
  <meta charset="UTF-8">
  <!-- 上面这行保证中文不乱码，务必保留 -->
  <title>第1课：HTML 基础结构</title>
  <!-- title 是浏览器标签页上显示的文字 -->
</head>

<body>
  <!-- body 里放的才是"用户真正能看到的内容" -->

  <!-- 一、标题：h1 到 h6，数字越小字越大 -->
  <h1>一级标题（最大）</h1>
  <h2>二级标题</h2>
  <h3>三级标题</h3>
  <h4>四级标题</h4>
  <h5>五级标题</h5>
  <h6>六级标题（最小）</h6>

  <!-- 二、段落：p 标签，用来写正文文字 -->
  <p>这是一个段落。写文章、写说明文字，都用 p。</p>
  <p>这是第二个段落，你可以看到它和上一个段落之间会自动空出距离。</p>

  <!-- 三、链接：a 标签，href 属性写要跳转的网址 -->
  <p>这是一个链接：<a href="https://github.com/xuholly/git">点我去你的 GitHub</a></p>

  <!-- 四、图片：img 标签，src 写图片地址，alt 写图片加载失败时显示的文字 -->
  <img src="sample.svg" alt="示例图片" width="300">

  <!-- 五、按钮：button 标签 -->
  <button>点我（现在还没绑定功能）</button>

</body>
</html>
