<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第2课：CSS 让页面变好看</title>
  <!-- 引入外部 CSS 文件：这是最推荐的做法，样式和结构分离 -->
  <link rel="stylesheet" href="lesson2-style.css">
</head>
<body>

  <!-- 给元素加 class，就能在 CSS 里"按名字"选中它来美化 -->
  <h1 class="title">CSS 让页面变好看</h1>

  <p class="intro">这段文字的颜色、大小，都是 CSS 设置的。</p>

  <a class="link" href="https://github.com/xuholly/git">我原本是个链接，被 CSS 化了个妆</a>

  <button class="btn">我是一个按钮</button>

  <!-- 一个"盒子"，用来演示边框、内边距、外边距 -->
  <div class="box">我是一个盒子，注意我的边框和内外间距</div>

</body>
</html>
