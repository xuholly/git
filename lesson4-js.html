<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>第4课：JavaScript 进阶（数组、循环、条件）</title>
  <link rel="stylesheet" href="lesson4-style.css">
</head>
<body>

  <h1>JS 进阶：数组、循环、条件判断</h1>

  <!-- 演示一：数组 + 循环，自动生成列表 -->
  <div class="card">
    <h2>一、数组 + 循环：自动生成列表</h2>
    <p>下面的列表不是手写的，是 JS 用循环从数组里生成的：</p>
    <ul id="fruit-list"></ul>
  </div>

  <!-- 演示二：条件判断 if/else -->
  <div class="card">
    <h2>二、条件判断：输入年龄</h2>
    <input id="age-input" placeholder="输入年龄">
    <p>判断结果：<span id="age-result"></span></p>
  </div>

  <!-- 演示三：猜数字游戏（综合） -->
  <div class="card">
    <h2>三、猜数字游戏（1~100）</h2>
    <p>我心里想了一个数字，你来猜：</p>
    <input id="guess-input" placeholder="输入 1~100">
    <button id="guess-btn">猜！</button>
    <p id="hint"></p>
  </div>

  <script src="lesson4-js.js"></script>
</body>
</html>
